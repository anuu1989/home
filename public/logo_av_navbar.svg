<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="50%" style="stop-color:#764ba2"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  
  <!-- Background - uses the site's primary gradient -->
  <rect x="8" y="8" width="176" height="176" rx="38" ry="38" fill="url(#bgGrad)"/>
  
  <!-- Monogram "AV" in white -->
  <g transform="translate(52, 50)">
    <!-- "A" -->
    <path d="M 0 92 L 28 0 L 56 92" 
          fill="none" 
          stroke="white" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <!-- A crossbar -->
    <line x1="12" y1="62" x2="44" y2="62" 
          stroke="rgba(255,255,255,0.7)" 
          stroke-width="9" 
          stroke-linecap="round"/>
    
    <!-- "V" -->
    <path d="M 40 0 L 68 92 L 96 0" 
          fill="none" 
          stroke="white" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.9"/>
  </g>
</svg>
