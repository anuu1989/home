<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Primary gradient for letters -->
    <linearGradient id="letterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="50%" style="stop-color:#764ba2"/>
      <stop offset="100%" style="stop-color:#9333ea"/>
    </linearGradient>
    
    <!-- Accent gradient for crossbar -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    
    <!-- Light background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0f0ff"/>
    </linearGradient>
    
    <!-- Soft glow -->
    <radialGradient id="softGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:0"/>
    </radialGradient>
    
    <!-- Shadow filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#667eea" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background - light rounded square -->
  <rect x="20" y="20" width="472" height="472" rx="80" ry="80" fill="url(#bgGradient)"/>
  
  <!-- Border -->
  <rect x="20" y="20" width="472" height="472" rx="80" ry="80" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Soft glow behind letters -->
  <circle cx="256" cy="230" r="150" fill="url(#softGlow)"/>
  
  <!-- Decorative elements - subtle dots -->
  <circle cx="120" cy="120" r="4" fill="#667eea" opacity="0.15"/>
  <circle cx="140" cy="105" r="2.5" fill="#764ba2" opacity="0.12"/>
  <circle cx="392" cy="400" r="4" fill="#667eea" opacity="0.15"/>
  <circle cx="375" cy="415" r="2.5" fill="#764ba2" opacity="0.12"/>
  
  <!-- Decorative arc - top right -->
  <path d="M 360 100 A 50 50 0 0 1 410 150" fill="none" stroke="#667eea" stroke-width="1.5" opacity="0.1"/>
  
  <!-- Decorative arc - bottom left -->
  <path d="M 100 360 A 50 50 0 0 1 150 410" fill="none" stroke="#764ba2" stroke-width="1.5" opacity="0.1"/>
  
  <!-- Main monogram with shadow -->
  <g filter="url(#softShadow)">
    <g transform="translate(175, 155)">
      <!-- "A" -->
      <path d="M 0 200 L 65 0 L 130 200" 
            fill="none" 
            stroke="url(#letterGradient)" 
            stroke-width="28" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
      <!-- A crossbar -->
      <line x1="28" y1="135" x2="102" y2="135" 
            stroke="url(#accentGradient)" 
            stroke-width="18" 
            stroke-linecap="round"
            opacity="0.9"/>
      
      <!-- "V" - slightly overlapping -->
      <path d="M 95 0 L 160 200 L 225 0" 
            fill="none" 
            stroke="url(#letterGradient)" 
            stroke-width="28" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            opacity="0.85"/>
    </g>
  </g>
  
  <!-- Bottom text -->
  <text x="256" y="440" 
        font-family="Inter, -apple-system, sans-serif" 
        font-size="15" 
        font-weight="600" 
        fill="#64748b" 
        text-anchor="middle" 
        letter-spacing="4">ANURAG VAIDHYA</text>
  
  <!-- Subtle tagline -->
  <text x="256" y="462" 
        font-family="Inter, -apple-system, sans-serif" 
        font-size="10" 
        font-weight="400" 
        fill="#94a3b8" 
        text-anchor="middle" 
        letter-spacing="2">SENIOR TECH LEADER</text>
</svg>
